# Netlify hosts TicketDepart's flight-search API only.
# The customer-facing website is deployed separately.
[build]
  command = "echo 'Preparing TicketDepart flight-search API deployment'"
  functions = "netlify/functions"
  publish = "netlify/api-public"

[build.environment]
  NODE_VERSION = "24.18.0"

[[redirects]]
  from = "/api/flight-search"
  to = "/.netlify/functions/flight-search"
  status = 200

[[redirects]]
  from = "/api/flight-autocomplete"
  to = "/.netlify/functions/flight-autocomplete"
  status = 200
