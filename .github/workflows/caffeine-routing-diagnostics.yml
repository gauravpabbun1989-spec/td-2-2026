name: Caffeine live canister routing diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/caffeine-routing-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Identify the live Caffeine canister and 404 response path
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare custom-domain and direct-canister responses
        shell: bash
        run: |
          set -euo pipefail
          probe="/__ticketdepart_canister_diagnostic_20261121__/"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          inspect_response() {
            label="$1"
            url="$2"
            headers="$3"
            body="$4"
            status="$(curl --location --silent --show-error --max-time 20 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" 2>/dev/null || true)"
            canister="$(grep -i '^x-ic-canister-id:' "$headers" | tail -1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' || true)"
            server="$(grep -i '^server:' "$headers" | tail -1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' || true)"
            content_type="$(grep -i '^content-type:' "$headers" | tail -1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' || true)"
            location="$(grep -i '^location:' "$headers" | tail -1 | sed -E 's/^[^:]+:[[:space:]]*//; s/\r$//' || true)"
            sha="$(sha256sum "$body" | awk '{print $1}')"
            title="$(grep -Eio '<title[^>]*>[^<]+' "$body" | head -1 | sed -E 's/<title[^>]*>//I' || true)"
            robots="$(grep -Eio '<meta[^>]*robots[^>]*>' "$body" | head -1 || true)"
            noindex="$(grep -Eqi '<meta[^>]*noindex' "$body" && echo yes || echo no)"
            branded="$(grep -Fqi 'This page has departed' "$body" && echo yes || echo no)"
            printf '%s\n' "[$label] status=$status canister_id=${canister:-missing} server=${server:-missing} content_type=${content_type:-missing}"
            printf '%s\n' "[$label] location=${location:-none} body_sha256=$sha title=${title:-none} branded_404=$branded noindex=$noindex"
            printf '%s\n' "[$label] robots_meta=${robots:-none}"
            printf '%s\n' "$canister"
          }

          dns_txt="$(dig +short TXT _canister-id.ticketdepart.com | tr -d '"' | tail -1 || true)"
          printf '%s\n' "[DNS] _canister-id.ticketdepart.com=${dns_txt:-missing}"

          inspect_response "custom-domain-home" "https://ticketdepart.com/" "$work/home.headers" "$work/home.body" | tee "$work/home.result"
          home_id="$(tail -1 "$work/home.result")"
          inspect_response "custom-domain-probe" "https://ticketdepart.com$probe" "$work/probe.headers" "$work/probe.body"

          if [ -n "$home_id" ]; then
            printf '%s\\n' "[IDENTITY] direct-canister-host=https://$home_id.icp.net"
            inspect_response "direct-canister-probe" "https://$home_id.icp.net$probe" "$work/direct.headers" "$work/direct.body"
            if [ -n "$dns_txt" ] && [ "$dns_txt" != "$home_id" ]; then
              printf '%s\n' "[WARNING] DNS TXT canister ID and HTTP canister ID do not match."
            fi
          else
            printf '%s\n' "[WARNING] The custom-domain response did not expose X-IC-Canister-ID; direct-canister comparison was skipped."
          fi
