name: TypeScript validation

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typecheck.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir src/frontend typecheck

      - name: Biome auto-fix
        run: pnpm --dir src/frontend fix

      - name: Commit Biome formatting fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/src
          if git diff --cached --quiet; then
            echo "No Biome formatting changes."
          else
            git commit -m "chore: apply Biome formatting"
            git push
          fi

      - name: Biome lint check
        run: pnpm --dir src/frontend check

      - name: Build frontend
        run: pnpm --dir src/frontend build
