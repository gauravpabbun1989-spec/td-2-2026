name: Submit live sitemap URLs to IndexNow

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/indexnow.yml"
      - "scripts/indexnow.mjs"
      - "src/frontend/public/sitemap.xml"
      - "src/frontend/public/e83061ad4141464eb71501dea95f7556.txt"

permissions:
  contents: read

concurrency:
  group: indexnow-sitemap-submit
  cancel-in-progress: false

jobs:
  submit-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit URLs from the live sitemap
        run: node scripts/indexnow.mjs
