name: Submit live sitemap URLs to IndexNow

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
  workflow_run:
    workflows:
      - Deploy Cloudflare Production
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: indexnow-sitemap-submit
  cancel-in-progress: false

jobs:
  submit-sitemap:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit URLs from the live sitemap
        run: node scripts/indexnow.mjs
