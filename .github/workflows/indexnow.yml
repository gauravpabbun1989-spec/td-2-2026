name: IndexNow notification

on:
  push:
    branches:
      - main
    paths:
      - "src/frontend/public/sitemap.xml"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow of sitemap URLs
        env:
          INDEXNOW_KEY: ticketdepart-indexnow-2026-09-22-7f4c9a21d8b3e6a5
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const sitemap = fs.readFileSync('src/frontend/public/sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>([^<]+)<\\/loc>/g)].map(m => m[1]);
          const body = JSON.stringify({
            host: 'ticketdepart.com',
            key: process.env.INDEXNOW_KEY,
            keyLocation: `https://ticketdepart.com/${process.env.INDEXNOW_KEY}.txt`,
            urlList: urls
          });
          const req = https.request('https://api.indexnow.org/indexnow', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json; charset=utf-8',
              'Content-Length': Buffer.byteLength(body)
            }
          }, res => {
            let data = '';
            res.on('data', c => data += c);
            res.on('end', () => {
              console.log(`IndexNow HTTP ${res.statusCode}: ${data}`);
              if (res.statusCode < 200 || res.statusCode >= 300) process.exitCode = 1;
            });
          });
          req.on('error', err => { console.error(err); process.exitCode = 1; });
          req.write(body);
          req.end();
          NODE
