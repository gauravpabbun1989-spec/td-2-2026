name: Submit live sitemap URLs to IndexNow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit URLs from the live sitemap
        run: node scripts/indexnow.mjs
