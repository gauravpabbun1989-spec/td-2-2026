name: Deploy call-tracker Worker

on:
  pull_request:
    branches: [main]
    paths:
      - "src/frontend/call-tracker-worker/**"
      - ".github/workflows/deploy-call-tracker-worker.yml"
  push:
    branches: [main]
    paths:
      - "src/frontend/call-tracker-worker/**"
      - ".github/workflows/deploy-call-tracker-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketdepart-call-tracker-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate call-tracker Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm --dir src/frontend typecheck

      - name: Run call-tracker tests
        run: pnpm --dir src/frontend exec vitest run --environment jsdom src/test/analytics-phone-click-payload.test.ts src/test/call-tracker-worker.test.ts src/test/telxio-webhook.test.ts

      - name: Run FreeSWITCH collector tests
        run: python -m unittest discover -s src/frontend/call-tracker-worker/freeswitch -p 'test_*.py'

      - name: Validate Worker bundle (no deployment)
        run: pnpm dlx wrangler@4.157.0 deploy --dry-run --config src/frontend/call-tracker-worker/wrangler.jsonc

  deploy:
    name: Deploy call-tracker Worker to production
    # PRs and pushes validate only; manual dispatch from main deploys after validation succeeds.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Require existing Cloudflare deployment secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi
          echo "Cloudflare deployment credential is present."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply additive call-tracker D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5421346b1bf08e0583cb670e97887719"
        run: pnpm dlx wrangler@4.157.0 d1 migrations apply ticketdepart-call-tracking --remote --config src/frontend/call-tracker-worker/wrangler.jsonc

      - name: Deploy only ticketdepart-call-tracker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "5421346b1bf08e0583cb670e97887719"
        run: pnpm dlx wrangler@4.157.0 deploy --config src/frontend/call-tracker-worker/wrangler.jsonc

      - name: Verify production health endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if response="$(curl --fail --silent --show-error https://ticketdepart-call-tracker.gaurav-pabbun.workers.dev/health)"; then
              echo "$response"
              echo "$response" | grep -q '"ok":true'
              echo "$response" | grep -q '"database":true'
              exit 0
            fi
            sleep 5
          done
          echo "::error::Worker health check did not succeed after deployment."
          exit 1
