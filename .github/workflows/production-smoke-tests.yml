name: Production smoke tests

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: read

concurrency:
  group: ticketdepart-production-smoke
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Verify live routes and indexing signals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check New York landing page
        shell: bash
        run: |
          set -euo pipefail
          url="https://ticketdepart.com/flights-from-new-york/"
          status="$(curl --location --silent --show-error --output /tmp/new-york.html --write-out '%{http_code}' "$url")"
          test "$status" = "200"
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/new-york.html', 'utf8');
          const checks = [
            ['New York page title', /<title>[^<]*Flights From New York/i.test(html)],
            ['indexable robots meta', /<meta[^>]*name=["']robots["'][^>]*content=["']index,\s*follow/i.test(html) || /<meta[^>]*content=["']index,\s*follow["'][^>]*name=["']robots/i.test(html)],
            ['self-referencing canonical', /<link[^>]*rel=["']canonical["'][^>]*href=["']https:\/\/ticketdepart\.com\/flights-from-new-york\//i.test(html) || /<link[^>]*href=["']https:\/\/ticketdepart\.com\/flights-from-new-york\//i.test(html) && /<link[^>]*rel=["']canonical/i.test(html)],
            ['production phone CTA', /tel:\+18332250511/.test(html)],
            ['New York route content', /Flights from New York/i.test(html)],
          ];
          for (const [name, ok] of checks) console.log((ok ? 'PASS ' : 'FAIL ') + name);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE

      - name: Check the economy-first phone-booking guide
        shell: bash
        run: |
          set -euo pipefail
          url="https://ticketdepart.com/how-to-book-a-flight-by-phone/"
          status="$(curl --location --silent --show-error --output /tmp/phone-guide.html --write-out '%{http_code}' "$url")"
          test "$status" = "200"
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const html = fs.readFileSync('/tmp/phone-guide.html', 'utf8');
            const checks = [
              ['phone guide title', /<title>[^<]*How to Book a Flight by Phone/i.test(html)],
              ['indexable robots meta', /<meta[^>]*name=["']robots["'][^>]*content=["']index,\s*follow/i.test(html) || /<meta[^>]*content=["']index,\s*follow["'][^>]*name=["']robots/i.test(html)],
              ['self-referencing canonical', /<link[^>]*rel=["']canonical["'][^>]*href=["']https:\/\/ticketdepart\.com\/how-to-book-a-flight-by-phone\//i.test(html) || /<link[^>]*href=["']https:\/\/ticketdepart\.com\/how-to-book-a-flight-by-phone\//i.test(html) && /<link[^>]*rel=["']canonical/i.test(html)],
              ['economy fare comparison content', /Economy fare comparison/i.test(html)],
              ['full trip cost content', /Compare the full trip cost/i.test(html)],
              ['changes and refunds content', /Changes, cancellations, and refunds/i.test(html)],
              ['production phone CTA', /tel:\+18332250511/.test(html)],
            ];
            for (const [name, ok] of checks) console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (checks.some(([, ok]) => !ok)) throw new Error('Phone guide static HTML checks failed.');

            const base = 'https://ticketdepart.com/';
            const scriptUrls = [...html.matchAll(/<script\b[^>]*src=["']([^"']+\.js(?:\?[^"']*)?)["'][^>]*>/gi)]
              .map((match) => new URL(match[1], base));
            if (scriptUrls.length === 0) {
              console.log('PASS phone guide is pre-rendered static HTML; the content checks above are sufficient for this route.');
              return;
            }

            const scriptBodies = await Promise.all(scriptUrls.map(async (url) => {
              const response = await fetch(url, { cache: 'no-store' });
              if (!response.ok) throw new Error('Could not fetch live script bundle: ' + url + ' (HTTP ' + response.status + ')');
              return { url, body: await response.text() };
            }));

            let pageChunkUrl;
            for (const script of scriptBodies) {
              const match = script.body.match(/(?:\.\/|\/assets\/)(HowToBookFlightByPhonePage-[A-Za-z0-9_-]+\.js)/);
              if (match) {
                pageChunkUrl = new URL(match[1], script.url);
                break;
              }
            }
            if (!pageChunkUrl) throw new Error('Could not locate the lazy-loaded phone guide JavaScript chunk.');

            const chunkResponse = await fetch(pageChunkUrl, { cache: 'no-store' });
            if (!chunkResponse.ok) throw new Error('Could not fetch live phone guide bundle (HTTP ' + chunkResponse.status + ')');
            const bundle = await chunkResponse.text();
            const bundleChecks = [
              ['compiled economy fare comparison', bundle.includes('Economy fare comparison')],
              ['compiled full trip cost', bundle.includes('Compare the full trip cost')],
              ['old keyword-stuffed list removed', !bundle.includes('Travelers searching how to book a flight by phone may also need')],
            ];
            for (const [name, ok] of bundleChecks) console.log((ok ? 'PASS ' : 'FAIL ') + name);
            if (bundleChecks.some(([, ok]) => !ok)) throw new Error('Live phone guide JavaScript bundle is stale or missing updated copy.');
            console.log('PASS live phone guide JavaScript bundle contains the updated economy-first copy.');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Confirm an unknown route returns HTTP 404 and noindex
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --location --silent --show-error --output /tmp/not-found.html --write-out '%{http_code}' "https://ticketdepart.com/__ticketdepart_404_smoke_test_20261101__/")"
          if [ "$status" != "404" ]; then
            echo "FAIL unknown route returned HTTP $status; expected 404"
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/not-found.html', 'utf8');
          const robots = html.match(/<meta\b[^>]*>/gi)?.find(tag => /name=["']robots["']/i.test(tag));
          if (!robots || !/content=["']noindex/i.test(robots)) {
            console.error('FAIL unknown route is missing a noindex robots directive');
            process.exit(1);
          }
          console.log('PASS unknown route returns HTTP 404 with noindex');
          NODE

      - name: Confirm security probes and malformed routes return HTTP 404
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "https://ticketdepart.com/.env" \
            "https://ticketdepart.com/flights-from-new-york/null"
          do
            output="$(mktemp)"
            status="$(curl --location --silent --show-error --output "$output" --write-out '%{http_code}' "$url")"
            if [ "$status" != "404" ]; then
              echo "FAIL $url returned HTTP $status; expected 404"
              exit 1
            fi
            if ! grep -Fqi 'noindex, nofollow' "$output"; then
              echo "FAIL $url did not return the branded noindex 404 document"
              exit 1
            fi
            echo "PASS $url returns HTTP 404 with noindex"
            rm -f "$output"
          done
