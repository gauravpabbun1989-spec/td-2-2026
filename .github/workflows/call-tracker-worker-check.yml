name: Call tracker Worker validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/frontend/call-tracker-worker/**"
      - "src/frontend/src/lib/analytics.ts"
      - "src/frontend/src/test/analytics-phone-click-payload.test.ts"
      - "src/frontend/src/test/call-tracker-worker.test.ts"
      - ".github/workflows/call-tracker-worker-check.yml"
      - ".github/workflows/deploy-call-tracker-worker.yml"
  push:
    branches: [main]
    paths:
      - "src/frontend/call-tracker-worker/**"
      - "src/frontend/src/lib/analytics.ts"
      - "src/frontend/src/test/analytics-phone-click-payload.test.ts"
      - "src/frontend/src/test/call-tracker-worker.test.ts"
      - ".github/workflows/call-tracker-worker-check.yml"
      - ".github/workflows/deploy-call-tracker-worker.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/frontend typecheck
      - run: pnpm --dir src/frontend exec vitest run --environment jsdom src/test/analytics-phone-click-payload.test.ts src/test/call-tracker-worker.test.ts
      - run: pnpm dlx wrangler@4.157.0 deploy --dry-run --config src/frontend/call-tracker-worker/wrangler.jsonc
