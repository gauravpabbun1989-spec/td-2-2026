name: Build and typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/frontend typecheck
      - run: pnpm --dir src/frontend exec biome check --write --unsafe src
      - run: pnpm --dir src/frontend check
      - run: pnpm --dir src/frontend test
      - run: pnpm --dir src/frontend build
      - run: mops check
      - run: mops build
      - run: pnpm bindgen
      - run: pnpm test:backend
      - run: node scripts/full-project-audit.mjs
