name: Deploy Cloudflare Production

on:
  workflow_run:
    workflows: ["Build and typecheck"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ticketdepart-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production Worker
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Confirm the validated commit is still the latest main
        id: freshness
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --quiet
          current_main="$(git rev-parse FETCH_HEAD)"
          if [ "$current_main" != "$VALIDATED_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment: a newer main commit exists."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Validated commit is the current main; deployment may proceed."
          fi

      - name: Set up pnpm
        if: steps.freshness.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node.js
        if: steps.freshness.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm --dir src/frontend build

      - name: Deploy Cloudflare Worker to production
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm dlx wrangler@4.156.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
