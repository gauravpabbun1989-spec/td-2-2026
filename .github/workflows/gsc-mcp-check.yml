name: Google Search Console MCP checks

on:
  pull_request:
    branches: [main]
    paths:
      - "integrations/gsc-mcp/**"
      - ".github/workflows/gsc-mcp-check.yml"
  push:
    branches: [main]
    paths:
      - "integrations/gsc-mcp/**"
      - ".github/workflows/gsc-mcp-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/gsc-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/gsc-mcp/package.json
      - run: npm install
      - run: npm run check
