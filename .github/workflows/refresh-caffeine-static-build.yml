name: Refresh Caffeine static build

on:
  push:
    branches: [main]
    paths-ignore:
      - "src/frontend/dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caffeine-static-build-main
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir src/frontend build
      - name: Commit generated static files for Caffeine import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/frontend/dist
          if git diff --cached --quiet; then
            echo "Generated Caffeine static files are already current."
          else
            git commit -m "build: refresh Caffeine static output"
            git push origin main
          fi
