    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function(){window.dataLayer.push(arguments);};
      // Recover once when a cached HTML document references a missing Vite chunk.
      // This is especially important after a Caffeine import changes hashed asset names.
      (function installChunkRecovery() {
        const retryKey = "ticketdepart:chunk-retry:" + (window.location.pathname || "/");
        let retryAttempted = false;
        window.addEventListener("vite:preloadError", function (event) {
          event.preventDefault();
          if (retryAttempted) return;
          retryAttempted = true;
          try {
            if (window.sessionStorage.getItem(retryKey) === "1") {
              console.error("TicketDepart could not load a required JavaScript asset after one refresh.");
              return;
            }
            window.sessionStorage.setItem(retryKey, "1");
          } catch {
            // In-memory guard still prevents repeated reloads when storage is blocked.
          }
          window.location.reload();
        });
        window.addEventListener("load", function () {
          window.setTimeout(function () {
            try { window.sessionStorage.removeItem(retryKey); } catch {}
          }, 10000);
        }, { once: true });
      })();
      // Repair malformed legacy links like /delta-airlines/null before GA4
      // configuration or React starts, so valid base routes are measured cleanly.
      function normalizeNullSuffixPath() {
        const path = (window.location.pathname || "/").replace(/\/+$/, "") || "/";
        if (!/\/null$/i.test(path)) return;
        const cleanPath = path.slice(0, -5).replace(/\/+$/, "") || "/";
        window.history.replaceState(window.history.state, "", cleanPath + window.location.search + window.location.hash);
      }
      normalizeNullSuffixPath();
      function isKnownProbePath() {
        let path = (window.location.pathname || "/").toLowerCase();
        // Decode bounded layers because scanners often encode separators and dotfiles.
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            const decoded = decodeURIComponent(path);
            if (decoded === path) break;
            path = decoded;
          } catch {
            break;
          }
        }
        path = path.replace(/\\/g, "/").replace(/\/+$/, "") || "/";
        if (path.startsWith("//")) return true;

        const exactProbePaths = new Set([
          "/.env", "/.env::$data", "/.env.local", "/.env.production", "/.flaskenv",
          "/.git", "/.git/config", "/.git-secret", "/.hg", "/.svn", "/.dockerenv",
          "/.bashrc", "/.npmrc", "/.zshrc", "/.circleci/config.yml", "/.next",
          "/.aws/credentials", "/.ssh", "/id_rsa", "/etc/passwd",
          "/wp-login.php", "/wp-config.php", "/wp-json", "/xmlrpc.php",
          "/phpinfo.php", "/php-info.php", "/config.php", "/composer.json",
          "/database.sql", "/dump.sql", "/backup.sql", "/server-status",
          "/server.key", "/key.pem", "/aws-credentials.txt", "/health",
          "/api", "/api/health", "/api/settings", "/api/account", "/api/config",
          "/api/env", "/api/v1/config", "/api/v1/env", "/api/v1/settings",
          "/webpack.config.js", "/debug/default/view", "/app_dev.php/_profiler/open",
          "/test_phpinfo5.php", "/serverless.yaml", "/ssl/server.key",
          "/proc/self/environ", "/var/run/secrets/kubernetes.io/serviceaccount/token",
          "/userfiles"
        ]);
        if (exactProbePaths.has(path)) return true;

        const segments = path.split("/").filter(Boolean);
        const probeSegments = new Set([
          ".git", ".env", ".aws", ".ssh", ".dockerenv", ".bashrc", ".npmrc",
          ".zshrc", "wp-admin", "wp-includes", "wp-content", "phpmyadmin",
          "cgi-bin", "phpunit", "actuator"
        ]);
        if (segments.some((segment) => probeSegments.has(segment))) return true;

        return /(?:^|\/)(?:config|credentials|secrets?|database|dump|backup|wp-config|phpinfo|php-info)\.(?:php|txt|json|sql|bak|old|save|yml|yaml)$/i.test(path)
          || /(?:^|\/)(?:\.env(?:\.[^/]+)?|\.git(?:-[^/]+)?|\.hg|\.svn|\.ssh|\.aws|\.next|\.circleci|\.docker|\.terraform|\.npmrc|\.yarnrc|\.flaskenv)(?:\/|$)/i.test(path)
          || /(?:^|\/)(?:var\/log|proc\/self|etc\/passwd|debug\/default\/view|app_dev\.php\/_profiler|_next\/webpack-hmr|webpack-hmr)(?:\/|$)/i.test(path)
          || /\.(?:php|sql|tfstate|tfvars|pem|key|bak|old|save|yaml|yml)$/i.test(path)
          || /(?:^|\/)(?:package\.json|docker-compose\.yml|serverless\.yml|webpack\.config\.js|terraform\.lock\.hcl)$/i.test(path);
      }
      window.isKnownProbePath = isKnownProbePath;
      function loadAnalytics() {
        if (window.__ticketdepartAnalyticsLoaded) return;
        window.__ticketdepartAnalyticsLoaded = true;
        const script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-4WC5K9Q31E";
        document.head.appendChild(script);
      }
      if (!isKnownProbePath()) {
        // Queue configuration before application events so early phone clicks
        // are not queued ahead of the GA4 destination configuration.
        window.gtag("js", new Date());
        window.gtag("config", "G-4WC5K9Q31E");
        // Load GA4 immediately (asynchronously) so activity is not delayed behind idle scheduling.
        loadAnalytics();
      }
    </script>
