    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function(){window.dataLayer.push(arguments);};
      // Repair malformed legacy links like /delta-airlines/null before GA4
      // configuration or React starts, so valid base routes are measured cleanly.
      function normalizeNullSuffixPath() {
        const path = (window.location.pathname || "/").replace(/\/+$/, "") || "/";
        if (!/\/null$/i.test(path)) return;
        const cleanPath = path.slice(0, -5).replace(/\/+$/, "") || "/";
        window.history.replaceState(window.history.state, "", cleanPath + window.location.search + window.location.hash);
      }
      normalizeNullSuffixPath();
      function isKnownProbePath() {
        const path = (window.location.pathname || "/").toLowerCase().replace(/\/+$/, "") || "/";
        // Match known secret/config and exploit-probe targets only. Do not
        // reject arbitrary .json/.txt/.php URLs or ordinary TicketDepart routes.
        const segments = path.split("/").filter(Boolean);
        const exactProbeFiles = new Set([
          "/.env", "/.git", "/.git/config", "/.dockerenv", "/.bashrc", "/.npmrc", "/.zshrc", "/.env::$data",
          "/wp-login.php", "/xmlrpc.php", "/wp-config.php",
          "/config.php", "/phpinfo.php", "/php-info.php",
          "/aws-credentials.txt", "/.aws/credentials",
          "/id_rsa", "/etc/passwd", "/server-status",
          "/composer.json", "/.env.local", "/.env.production", "/wp-json", "/api/account", "/api/config", "/api/env", "/api/v1/env", "/api/v1/settings", "/health", "/key.pem", "/server.key",
          "/database.sql", "/dump.sql", "/backup.sql"
        ]);
        if (exactProbeFiles.has(path)) return true;
        const probeSegments = new Set([
          ".git", ".env", ".aws", ".ssh", ".dockerenv", ".bashrc", ".npmrc", ".zshrc",
          "wp-admin", "wp-includes", "wp-content", "phpmyadmin",
          "cgi-bin", "phpunit", "actuator"
        ]);
        if (segments.some((segment) => probeSegments.has(segment))) {
          if (segments.includes("actuator") && segments[segments.indexOf("actuator") + 1] !== "env") {
            return false;
          }
          return true;
        }
        const file = segments[segments.length - 1] || "";
        return /^(?:aws-credentials|wp-config|phpinfo|php-info|config|credentials|secrets|database|dump|backup)\.(?:php|txt|json|sql|bak|old)$/i.test(file);
      }
      function loadAnalytics() {
        if (window.__ticketdepartAnalyticsLoaded) return;
        window.__ticketdepartAnalyticsLoaded = true;
        const script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-4WC5K9Q31E";
        document.head.appendChild(script);
      }
      if (!isKnownProbePath()) {
        // Queue configuration before application events so early phone clicks
        // are not queued ahead of the GA4 destination configuration.
        window.gtag("js", new Date());
        window.gtag("config", "G-4WC5K9Q31E");
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadAnalytics, { timeout: 6000 });
        } else {
          window.addEventListener("load", () => setTimeout(loadAnalytics, 6000), { once: true });
        }
      }
    </script>

  <body>
    <div id="root">
      <div id="initial-loader" aria-hidden="true">
        <div class="initial-loader__mark">TD</div>
        <div class="initial-loader__text">TicketDepart</div>
      </div>
    </div>
    <style>
      html, body { margin: 0; min-height: 100%; background: #fbfaf6; }
      #root { min-height: 100vh; }
      #initial-loader { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 10px; font-family: Arial, sans-serif; color: #18233d; background: #fbfaf6; }
      .initial-loader__mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: #18233d; color: #fff; font-weight: 800; letter-spacing: .04em; }
      .initial-loader__text { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
    </style>
    <script>
      // Do not boot React, download the application bundle, or initialize app code
      // for obvious exploit/probe URLs. This is client-side hardening, not a
      // substitute for an edge/WAF rule that rejects the HTTP request itself.
      if (isKnownProbePath()) {
        document.title = "404 — Page Not Found | TicketDepart";
        const root = document.getElementById("root");
        if (root) {
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-content:center;padding:24px;box-sizing:border-box;font:16px Arial,sans-serif;color:#18233d;background:#fbfaf6"><h1 style="margin:0 0 12px">Page not found</h1><p style="margin:0">The requested page is unavailable.</p></main>';
        }
      } else {
        const app = document.createElement("script");
        app.type = "module";
        app.src = "./src/main.tsx";
        document.body.appendChild(app);
      }
    </script>
  </body>
